name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  release-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure scripts executable
        run: chmod +x deploy/*.sh scripts/*.sh

      - name: Run release checklist
        run: ./deploy/release-check.sh
